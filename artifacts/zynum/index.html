<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- SEO Primary -->
    <title>ZyNum - Numéros Virtuels pour SMS & OTP | Afrique & Monde</title>
    <meta name="description" content="ZyNum vous permet d'acheter des numéros virtuels temporaires pour recevoir des SMS de vérification OTP (Telegram, WhatsApp, Google, TikTok...). Paiement en FCFA, livraison instantanée. 180+ pays." />
    <meta name="keywords" content="numéro virtuel, SMS OTP, vérification SMS, numéro temporaire, FCFA, Afrique, Cameroun, Sénégal, Côte d'Ivoire, Telegram, WhatsApp, Google" />
    <meta name="author" content="ZyNum" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zynum.net/" />

    <!-- Open Graph (Facebook, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zynum.net/" />
    <meta property="og:site_name" content="ZyNum" />
    <meta property="og:title" content="ZyNum - Numéros Virtuels pour SMS & OTP" />
    <meta property="og:description" content="Achetez des numéros virtuels pour recevoir vos codes SMS de vérification. Paiement en FCFA, livraison en moins de 30 secondes. 180+ pays disponibles." />
    <meta property="og:image" content="https://zynum.net/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZyNum - Numéros Virtuels pour SMS & OTP" />
    <meta name="twitter:description" content="Achetez des numéros virtuels pour recevoir vos codes SMS de vérification. Paiement en FCFA, livraison instantanée." />
    <meta name="twitter:image" content="https://zynum.net/opengraph.jpg" />

    <!-- Structured Data JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ZyNum",
      "url": "https://zynum.net",
      "logo": "https://zynum.net/logo.jpg",
      "description": "Plateforme de numéros virtuels pour recevoir des SMS de vérification OTP. Paiement en FCFA et USD. Livraison instantanée dans 180+ pays.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "priceCurrency": "XAF",
        "price": "1100",
        "description": "Numéro virtuel à partir de 1100 FCFA"
      },
      "publisher": {
        "@type": "Organization",
        "name": "ZyNum",
        "url": "https://zynum.net",
        "logo": "https://zynum.net/logo.jpg",
        "sameAs": [
          "https://facebook.com/zynum",
          "https://youtube.com/@zynum",
          "https://t.me/ZyNumSupport"
        ]
      }
    }
    </script>

    <script>
      (function() {
        var t = localStorage.getItem("zynum_theme");
        if (t === "light") document.documentElement.classList.add("light");
        else document.documentElement.classList.add("dark");
      })();
    </script>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
