# ─────────────────────────────────────────────────────────────────────────────
# ZyNum — snippet nginx à coller dans la config Plesk du vhost app.zynum.net
# Emplacement typique: /etc/nginx/conf.d/app.zynum.net.conf
#   ou via Plesk → Domaines → app.zynum.net → Paramètres Apache & nginx
#   → section "Directives supplémentaires nginx (https)"
# ─────────────────────────────────────────────────────────────────────────────

# Taille max upload (photos de preuve de paiement, etc.)
client_max_body_size 10m;

# ── Gzip ─────────────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json
           application/javascript application/xml+rss
           application/atom+xml image/svg+xml;

# ── Cache des assets statiques ────────────────────────────────────────────────
location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ── Proxy vers Node.js (Passenger ou PM2 sur port 3000) ─────────────────────
# Si vous utilisez Passenger, Plesk configure le proxy automatiquement.
# Si vous utilisez PM2, décommentez le bloc ci-dessous ET désactivez Passenger.
#
# location / {
#     proxy_pass         http://127.0.0.1:3000;
#     proxy_http_version 1.1;
#     proxy_set_header   Upgrade $http_upgrade;
#     proxy_set_header   Connection "upgrade";
#     proxy_set_header   Host $host;
#     proxy_set_header   X-Real-IP $remote_addr;
#     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header   X-Forwarded-Proto $scheme;
#     proxy_read_timeout 60s;
# }

# ── Sécurité ─────────────────────────────────────────────────────────────────
add_header X-Content-Type-Options  "nosniff"         always;
add_header X-Frame-Options         "SAMEORIGIN"      always;
add_header Referrer-Policy         "strict-origin"   always;
